name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
        with:
          flakehub-cache: true

      - name: Format check
        run: nix develop --command cargo fmt -- --check

      - name: Clippy
        run: nix develop --command cargo clippy -- -D warnings

      - name: Test
        run: nix develop --command cargo test

      - name: Build
        run: nix develop --command cargo build --release

  nixos-tests:
    name: nixosTests · cli-config · assuan · tty · wayland
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
        with:
          flakehub-cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Permanent differential parity oracles: each test runs the in-tree
      # Rust target against the pinned pkgs.wayprompt (nixos-26.05) baseline
      # and is a hard regression gate — any behavioral drift fails CI.
      - name: Run nixosTests (cli-config)
        run: nix build .#nixosTests.cli-config --print-build-logs

      - name: Run nixosTests (assuan)
        run: nix build .#nixosTests.assuan --print-build-logs

      - name: Run nixosTests (tty)
        run: nix build .#nixosTests.tty --print-build-logs

      - name: Run nixosTests (wayland)
        run: nix build .#nixosTests.wayland --print-build-logs

      - name: Package interface check
        run: nix flake check
