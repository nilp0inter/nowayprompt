name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: fmt · clippy · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          flakehub-cache: true

      - name: Format check
        run: nix develop --command cargo fmt -- --check

      - name: Clippy
        run: nix develop --command cargo clippy -- -D warnings

      - name: Test
        run: nix develop --command cargo test

      - name: Build
        run: nix develop --command cargo build --release

  nixos-tests:
    name: nixosTests · stage-1 · stage-2 · stage-3
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3
        with:
          flakehub-cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Staggered parity oracles: these FAIL at documented parity gates
      # until the Rust target reaches 1:1 behavioral parity with the
      # pinned pkgs.wayprompt (nixos-26.05 v0.1.2) baseline. Run them so
      # regressions and progress are visible in CI; convert to hard
      # gates (remove continue-on-error) once each stage passes.
      - name: Run nixosTests (stage-1-cli-config)
        continue-on-error: true
        run: nix build .#nixosTests.stage-1-cli-config --print-build-logs

      - name: Run nixosTests (stage-2-assuan)
        continue-on-error: true
        run: nix build .#nixosTests.stage-2-assuan --print-build-logs

      - name: Run nixosTests (stage-3-tty)
        continue-on-error: true
        run: nix build .#nixosTests.stage-3-tty --print-build-logs