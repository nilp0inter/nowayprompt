name: Update flake inputs

on:
  schedule:
    # Run weekly on Sunday at 04:00 UTC.
    - cron: "0 4 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  update:
    name: Update flake.lock
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@d96678350ffd6a456235832eb11e1c491589b7bb # v3.21.8
        with:
          flakehub-cache: true

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Update flake inputs
        run: nix flake update --commit-lock-file

      - name: Verify build
        run: nix develop --command cargo build --release

      - name: Create pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          title: "chore: update flake.lock"
          body: |
            Automated weekly update of flake inputs.

            Build verified: `nix develop --command cargo build --release` passes.
          branch: flake-update
          delete-branch: true
          labels: dependencies, nix
          commit-message: "chore: update flake.lock"