[package]
name = "nowayprompt"
version = "0.1.0"
edition = "2021"
license = "ISC"

[[bin]]
name = "nowayprompt-wayland-test"
path = "src/bin/wayland-test.rs"

[dependencies]
libc = "0.2"
zeroize = "1.8"
memmap2 = "0.9"
signal-hook = "0.3"
# --- Stage 3: Wayland frontend ---
# Pure-Rust Wayland client (default `rs` socket backend; no libwayland-client.so).
wayland-client = "0.31"
# wlr protocols: zwlr_layer_shell_v1 (needs `client` feature).
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# Core protocols (for wp_fractional_scale_manager_v1, separate from -wlr).
# 0.31.2 is the version pulled transitively by wayland-protocols-wlr;
# pinning here unifies the dep. cursor_shape needs `staging`+`unstable`,
# fractional_scale needs `staging`.
wayland-protocols = { version = "0.31", features = ["client", "staging", "unstable"] }
tiny-skia = "0.11"
# Text shaping/layout (replaces fcft).
cosmic-text = "0.12"
# Font source type for `FontSystem::new_with_fonts` (transitive dep of cosmic-text).
fontdb = "0.16"
# XKB keymap: sole C-dlopen exception (D3). dlopens libxkbcommon.so at runtime.
xkbcommon = { version = "0.8", features = ["x11"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1